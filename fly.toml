# Fly.io 部署配置
# 用法：安装 flyctl 后设置 FLY_API_TOKEN，执行 `fly deploy`
app = "avalon-companion"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  builder = "heroku/buildpacks:20"

[env]
  AVALON_DATA_FILE = "none"
  PORT = "8080"
  HOST = "0.0.0.0"
  NODE_VERSION = "20"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
